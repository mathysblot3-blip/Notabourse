# Apparence du site (thème sombre). Le vert, l'orange et le rouge sont réservés au garde-fou [M] cahier des charges.
[theme]
base = "dark"
primaryColor = "#5B8DEF"              # bleu : barres, jauge, boutons
backgroundColor = "#0F1117"           # fond de page
secondaryBackgroundColor = "#1B1F2A"  # fond des encadrés
textColor = "#E8EAED"                 # texte

[client]
toolbarMode = "minimal"               # menu de Streamlit réduit pour les visiteurs
showErrorDetails = "none"            # en cas d'erreur, message général : ni code ni chemins de fichiers montrés
                                      # aux visiteurs (audit de sécurité du 19/10/2026)

[browser]
gatherUsageStats = false              # pas d'envoi de statistiques d'usage à Streamlit depuis le PC
