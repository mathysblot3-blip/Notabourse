# Robot d'essai du classement mondial (04/11/2026) : mesure combien de sociétés hors S&P 500 Yahoo laisse noter par
# heure depuis les ordinateurs de GitHub. Ne publie rien, ne touche pas au site : il affiche seulement un bilan.
# Se lance tout seul quand ce fichier est envoyé sur GitHub, ou à la main (bouton « Run workflow » de l'onglet Actions).

name: Essai du classement mondial

on:
  push:
    paths:
      - .github/workflows/essai_classement.yml   # lancé quand ce fichier change
      - reference/essai_classement.py            # ou quand le script change
  workflow_dispatch:                             # bouton « Run workflow »

permissions:
  contents: read                 # lecture seule : ce robot ne peut rien publier

concurrency:
  group: reference-hebdo         # même groupe que le robot du samedi : jamais les deux en même temps (Yahoo)
  cancel-in-progress: false

jobs:
  essai:
    runs-on: ubuntu-latest       # ordinateur prêté par GitHub, effacé après chaque passage
    timeout-minutes: 75          # arrêt de sécurité (l'essai dure 45 minutes)
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, figée par son commit

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, figée par son commit
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Noter des sociétés hors S&P 500 pendant 45 minutes
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # en-tête demandé par la SEC (secret du dépôt)
          DUREE_MINUTES: "45"
        run: python reference/essai_classement.py
